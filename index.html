<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tari's Table</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbeef2;color:#6e1229;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:150px}
header{text-align:center;padding:26px 16px 14px}
h1{font-size:2.2rem;margin:0;color:#7a1530;font-weight:600;font-family:Georgia,"Times New Roman",serif}
.tag{letter-spacing:.25em;font-size:.7rem;color:#b0556f;margin-top:6px;text-transform:uppercase}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.toggle{display:flex;gap:8px;margin:12px 0 8px}
.toggle button{flex:1;padding:10px;border-radius:999px;border:1px solid #e9b8c8;background:#fff;color:#6e1229;font:inherit;font-size:.95rem;cursor:pointer}
.toggle button.on{background:#7a1530;color:#fff;border-color:#7a1530}
.week{text-align:center;color:#b0556f;font-size:.9rem;margin:6px 0}
.section{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.section::before,.section::after{content:"";flex:1;height:1px;background:#e9b8c8}
.section span{background:#f4c2d7;padding:4px 18px;border-radius:999px;letter-spacing:.3em;font-size:.8rem;color:#7a1530}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #e9b8c8;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.name{font-size:1rem;color:#6e1229}
.meta{font-size:.82rem;color:#b0556f;margin-top:2px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid #e9b8c8;background:#f4c2d7;color:#7a1530;font-size:1.1rem;cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step span{min-width:18px;text-align:center}
.details{background:#fff;border:1px solid #e9b8c8;border-radius:14px;padding:16px;margin-top:18px}
.details h3{margin:0 0 6px;color:#7a1530;font-size:1rem}
.field{margin-bottom:10px}
.field label{display:block;font-size:.82rem;color:#b0556f;margin:8px 0 4px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:1rem;padding:10px;border-radius:10px;border:1px solid #e9b8c8;background:#fbeef2;color:#6e1229}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:12px 0 4px}
.check input{width:18px;height:18px}
.empty{text-align:center;color:#b0556f;padding:20px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#7a1530;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.fee{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:8px;opacity:.9}
.send{width:100%;border:0;border-radius:14px;padding:14px;background:#fff;color:#7a1530;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
.send:disabled{background:#9a8a8f;color:#fff;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Tari's Table</h1>
  <div class="tag">Homemade · Fresh · Made with love</div>
</header>

<div class="wrap">
  <div class="toggle">
    <button id="bWeekly" class="on">Weekday Dinners</button>
    <button id="bShabbos">Shabbos</button>
  </div>
  <p class="week" id="weekOf"></p>
  <div id="menu"><p class="empty">Loading menu…</p></div>

  <div class="details">
    <h3>Your details</h3>
    <div class="field"><label for="name">Name</label><input id="name" required></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" required></div>
    <div class="field"><label for="when">Delivery</label><select id="when"></select></div>
    <div class="field"><label for="notes">Allergies or notes (address, etc.)</label><textarea id="notes" rows="2"></textarea></div>
    <label class="check"><input type="checkbox" id="gf"> I need gluten free</label>
  </div>
</div>

<div class="bar">
  <div class="fee"><span>Delivery fee</span><strong>$10</strong></div>
  <button class="send" id="send" disabled>Send order</button>
</div>

<script>
// Tari's WhatsApp number, digits only, with country code
const TARI_PHONE = "1778441461";
const DELIVERY_FEE = 10;

// Sections shown for each menu, in order
const SECTIONS = {
  weekly: [["main", "Mains"], ["side", "Sides"], ["soup", "Soups"]],
  shabbos: [["food", "Food"], ["salad", "Salads"]]
};
// Delivery options: weekdays Monday or Wednesday, Shabbos Friday only
const DAYS = {
  weekly: ["Monday", "Wednesday"],
  shabbos: ["Friday"]
};

let data = { weekOf: "", dishes: [] };
let mode = "weekly";
let cart = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function subtotal() {
  return Object.entries(cart).filter(([, q]) => q > 0).reduce((s, [i, q]) => s + data.dishes[i].price * q, 0);
}

function render() {
  $("weekOf").textContent = mode === "shabbos" ? "Shabbos menu" : data.weekOf;
  $("when").innerHTML = DAYS[mode].map(d => `<option>${esc(d)}</option>`).join("");

  const list = data.dishes.map((d, i) => ({ ...d, i }))
    .filter(d => d.menu === mode && d.available);

  if (!list.length) {
    $("menu").innerHTML = '<p class="empty">Nothing is available right now. Check back soon!</p>';
  } else {
    let html = "";
    for (const [cat, title] of SECTIONS[mode]) {
      const group = list.filter(d => d.cat === cat);
      if (!group.length) continue;
      html += `<div class="section"><span>${title.toUpperCase()}</span></div>`;
      for (const d of group) {
        const n = cart[d.i] || 0;
        html += `<div class="item">
          <div>
            <div class="name">${esc(d.name)}</div>
            <div class="meta">$${esc(d.price)}${d.serves ? " · serves " + esc(d.serves) : ""}</div>
          </div>
          <div class="step">
            <button data-i="${d.i}" data-d="-1" ${n === 0 ? "disabled" : ""}>−</button>
            <span>${n}</span>
            <button data-i="${d.i}" data-d="1">+</button>
          </div></div>`;
      }
    }
    $("menu").innerHTML = html;
  }

  const n = Object.values(cart).reduce((s, q) => s + Math.max(0, q), 0);
  $("send").disabled = n === 0;
  $("send").textContent = n ? `Send order · $${subtotal() + DELIVERY_FEE}` : "Send order";
}

$("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = Number(b.dataset.i);
  cart[i] = Math.max(0, (cart[i] || 0) + Number(b.dataset.d));
  render();
});

function setMode(m) {
  mode = m;
  cart = {};
  $("bWeekly").classList.toggle("on", m === "weekly");
  $("bShabbos").classList.toggle("on", m === "shabbos");
  render();
}
$("bWeekly").addEventListener("click", () => setMode("weekly"));
$("bShabbos").addEventListener("click", () => setMode("shabbos"));

$("send").addEventListener("click", () => {
  if (!$("name").reportValidity() || !$("phone").reportValidity()) return;
  const entries = Object.entries(cart).filter(([, q]) => q > 0);
  const lines = entries.map(([i, q]) => `${q} x ${data.dishes[i].name} ($${data.dishes[i].price * q})`);
  const sub = subtotal();
  const msg = [
    mode === "shabbos" ? "SHABBOS ORDER" : `WEEKDAY ORDER (${data.weekOf})`,
    `Name: ${$("name").value}`,
    `Phone: ${$("phone").value}`,
    `Delivery: ${$("when").value}`,
    "", ...lines, "",
    `Items: $${sub}`,
    `Delivery fee: $${DELIVERY_FEE}`,
    `Total: $${sub + DELIVERY_FEE}`,
    $("gf").checked ? "Gluten free: YES" : "",
    $("notes").value ? `Allergies/notes: ${$("notes").value}` : ""
  ].join("\n");
  window.open(`https://wa.me/${TARI_PHONE}?text=${encodeURIComponent(msg)}`, "_blank");
});

fetch("menu.json?" + Date.now())
  .then(r => r.json())
  .then(d => { data = d; render(); })
  .catch(() => { $("menu").innerHTML = '<p class="empty">The menu can\'t load right now. Please try again later.</p>'; });

render();
</script>
</body>
</html>
