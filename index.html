<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tari's Table</title>
<style>
*{box-sizing:border-box}
html{overflow-x:hidden;background:#fbeef2}
body{margin:0;width:100%;min-height:100vh;background:#fbeef2;color:#6e1229;font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
header{text-align:center;padding:14px 12px 10px;background:#fff;box-shadow:0 1px 0 #f0d3dd}
h1{font-size:1.5rem;margin:0;color:#7a1530;font-weight:600;line-height:1.1}
.tag{letter-spacing:.16em;font-size:.56rem;color:#b0556f;margin-top:3px;text-transform:uppercase}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:10px 10px 0}
.toggle{display:flex;background:#f4c2d7;border-radius:999px;padding:3px}
.toggle button{flex:1;padding:7px;border-radius:999px;border:0;background:none;color:#7a1530;font:inherit;font-size:.85rem;cursor:pointer}
.toggle button.on{background:#7a1530;color:#fff}
.week{text-align:center;color:#b0556f;font-size:.72rem;margin:6px 0 0;min-height:1em}
#menu{min-height:220px}
.section{display:flex;align-items:center;gap:8px;margin:12px 2px 6px;color:#7a1530;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase}
.section::after{content:"";flex:1;height:1px;background:#e9b8c8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item{background:#fff;border-radius:12px;padding:9px 9px 8px;box-shadow:0 1px 2px rgba(122,21,48,.07)}
.name{font-size:.84rem;line-height:1.25;min-height:2.5em}
.meta{font-size:.7rem;color:#b0556f;margin-top:2px;min-height:1.2em}
.add{margin-top:7px;width:100%;height:30px;border-radius:999px;border:1px solid #7a1530;background:#fff;color:#7a1530;font:inherit;font-size:.76rem;cursor:pointer}
.stepper{margin-top:7px;display:flex;align-items:center;justify-content:space-between;background:#7a1530;color:#fff;border-radius:999px;height:30px}
.stepper button{width:34px;height:30px;border:0;background:none;color:#fff;font-size:1.05rem;cursor:pointer;padding:0}
.stepper span{font-size:.82rem;font-weight:600}
.details{background:#fff;border-radius:12px;padding:12px;margin:12px 0 12px;box-shadow:0 1px 2px rgba(122,21,48,.07)}
.details h3{margin:0 0 4px;color:#7a1530;font-size:.82rem;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:.66rem;color:#b0556f;margin:6px 0 2px}
input,textarea{width:100%;padding:7px 8px;font:inherit;font-size:16px;border-radius:8px;border:1px solid #e9b8c8;background:#fbeef2;color:#6e1229;-webkit-appearance:none;appearance:none}
textarea{min-height:36px;font-size:14px}
.empty{text-align:center;color:#b0556f;padding:14px 0;font-size:.82rem}
.bar{position:sticky;bottom:0;left:0;right:0;width:100%;background:#7a1530;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 8px rgba(0,0,0,.12);z-index:10}
.fee{display:flex;justify-content:space-between;font-size:.74rem;margin-bottom:5px;opacity:.95}
.send{width:100%;border:0;border-radius:10px;padding:10px;background:#fff;color:#7a1530;font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
.send:disabled{background:#9a8a8f;color:#fff;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Tari's Table</h1>
  <div class="tag">Homemade · Fresh · Made with love</div>
</header>

<div class="wrap">
  <div class="toggle">
    <button id="bWeekly" class="on">Weekday</button>
    <button id="bShabbos">Shabbos</button>
  </div>
  <p class="week" id="weekOf"></p>
  <div id="menu"><p class="empty">Loading menu…</p></div>

  <div class="details">
    <h3>Your details</h3>
    <div class="row">
      <div><label for="name">Name</label><input id="name" autocomplete="name" required></div>
      <div><label for="phone">Number</label><input id="phone" type="tel" autocomplete="tel" required></div>
    </div>
    <label for="notes">Allergies</label>
    <textarea id="notes" rows="1" placeholder="None"></textarea>
  </div>
</div>

<div class="bar">
  <div class="fee"><span>Delivery fee</span><strong>$10</strong></div>
  <button class="send" id="send" disabled>Send order</button>
</div>

<script>
// Tari's WhatsApp number: country code 1 + 773 844 1461
const TARI_PHONE = "17738441461";
const DELIVERY_FEE = 10;

const SECTIONS = {
  weekly: [["main", "Mains"], ["side", "Sides"], ["soup", "Soups"]],
  shabbos: [["appetizer", "Appetizers"], ["main", "Mains"], ["side", "Sides"], ["salad", "Salads"]]
};

let data = { weekOf: "", dishes: [] };
let mode = "weekly";
let cart = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function subtotal() {
  return Object.entries(cart).filter(([, q]) => q > 0).reduce((s, [i, q]) => s + data.dishes[i].price * q, 0);
}

function render() {
  $("weekOf").textContent = mode === "shabbos" ? "Shabbos menu" : data.weekOf;

  const list = data.dishes.map((d, i) => ({ ...d, i })).filter(d => d.menu === mode && d.available);

  if (!list.length) {
    $("menu").innerHTML = '<p class="empty">Nothing is available right now. Check back soon!</p>';
  } else {
    const known = SECTIONS[mode];
    const isKnown = (c) => known.some(([k]) => k === c);
    const sections = [...known];
    if (list.some(d => !isKnown(d.cat))) sections.push([null, "Menu"]);

    let html = "";
    for (const [cat, title] of sections) {
      const group = cat === null ? list.filter(d => !isKnown(d.cat)) : list.filter(d => d.cat === cat);
      if (!group.length) continue;
      html += `<div class="section">${title}</div><div class="grid">`;
      for (const d of group) {
        const n = cart[d.i] || 0;
        const control = n === 0
          ? `<button class="add" data-i="${d.i}" data-d="1">Add</button>`
          : `<div class="stepper"><button data-i="${d.i}" data-d="-1">−</button><span>${n}</span><button data-i="${d.i}" data-d="1">+</button></div>`;
        html += `<div class="item">
          <div class="name">${esc(d.name)}</div>
          <div class="meta">$${esc(d.price)}${d.serves ? " · serves " + esc(d.serves) : ""}</div>
          ${control}
        </div>`;
      }
      html += `</div>`;
    }
    $("menu").innerHTML = html;
  }

  const n = Object.values(cart).reduce((s, q) => s + Math.max(0, q), 0);
  $("send").disabled = n === 0;
  $("send").textContent = n ? `Send order · $${subtotal() + DELIVERY_FEE}` : "Send order";
}

$("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = Number(b.dataset.i);
  cart[i] = Math.max(0, (cart[i] || 0) + Number(b.dataset.d));
  render();
});

function setMode(m) {
  mode = m;
  cart = {};
  $("bWeekly").classList.toggle("on", m === "weekly");
  $("bShabbos").classList.toggle("on", m === "shabbos");
  render();
}
$("bWeekly").addEventListener("click", () => setMode("weekly"));
$("bShabbos").addEventListener("click", () => setMode("shabbos"));

$("send").addEventListener("click", () => {
  if (!$("name").reportValidity() || !$("phone").reportValidity()) return;
  const entries = Object.entries(cart).filter(([, q]) => q > 0);
  const lines = entries.map(([i, q]) => `${q} x ${data.dishes[i].name} ($${data.dishes[i].price * q})`);
  const sub = subtotal();
  const msg = [
    mode === "shabbos" ? "SHABBOS ORDER" : `WEEKDAY ORDER (${data.weekOf})`,
    `Name: ${$("name").value}`,
    `Number: ${$("phone").value}`,
    "", ...lines, "",
    `Items: $${sub}`,
    `Delivery fee: $${DELIVERY_FEE}`,
    `Total: $${sub + DELIVERY_FEE}`,
    $("notes").value ? `Allergies: ${$("notes").value}` : ""
  ].join("\n");
  window.open(`https://wa.me/${TARI_PHONE}?text=${encodeURIComponent(msg)}`, "_blank");
});

fetch("menu.json?" + Date.now(), { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("menu.json not found (" + r.status + ")");
    return r.json();
  })
  .then(d => { data = d; render(); })
  .catch(err => {
    $("menu").innerHTML = `<p class="empty">The menu can't load right now.<br><small>${esc(err.message)}</small></p>`;
  });

render();
</script>
</body>
</html>
