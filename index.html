<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tari's Table</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbeef2;color:#6e1229;font-family:Georgia,"Times New Roman",serif;padding-bottom:104px;-webkit-text-size-adjust:100%}
header{text-align:center;padding:14px 16px 8px}
h1{font-size:1.6rem;margin:0;color:#7a1530;font-weight:600;line-height:1.1}
.tag{letter-spacing:.18em;font-size:.6rem;color:#b0556f;margin-top:3px;text-transform:uppercase}
.wrap{max-width:480px;margin:0 auto;padding:0 12px}
.toggle{display:flex;gap:6px;margin:8px 0 4px}
.toggle button{flex:1;padding:8px;border-radius:999px;border:1px solid #e9b8c8;background:#fff;color:#6e1229;font:inherit;font-size:.9rem;cursor:pointer}
.toggle button.on{background:#7a1530;color:#fff;border-color:#7a1530}
.week{text-align:center;color:#b0556f;font-size:.8rem;margin:4px 0 0}
.section{margin:14px 0 4px;text-align:center;color:#7a1530;letter-spacing:.2em;font-size:.72rem;text-transform:uppercase}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:5px}
.name{font-size:.92rem;line-height:1.2}
.meta{font-size:.74rem;color:#b0556f;margin-top:1px}
.step{display:flex;align-items:center;gap:8px;flex-shrink:0}
.step button{width:28px;height:28px;border-radius:50%;border:0;background:#f4c2d7;color:#7a1530;font-size:1.05rem;line-height:1;cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step span{min-width:14px;text-align:center;font-size:.9rem}
.details{background:#fff;border-radius:10px;padding:12px;margin:14px 0 0}
.details h3{margin:0 0 2px;color:#7a1530;font-size:.9rem;font-weight:600}
label{display:block;font-size:.74rem;color:#b0556f;margin:8px 0 3px}
input,textarea{width:100%;padding:8px 10px;font:inherit;font-size:16px;border-radius:8px;border:1px solid #e9b8c8;background:#fbeef2;color:#6e1229;-webkit-appearance:none}
textarea{min-height:44px;font-size:14px}
.empty{text-align:center;color:#b0556f;padding:16px 0;font-size:.85rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:#7a1530;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.fee{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:6px}
.send{width:100%;border:0;border-radius:10px;padding:11px;background:#fff;color:#7a1530;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.send:disabled{background:#9a8a8f;color:#fff;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Tari's Table</h1>
  <div class="tag">Homemade · Fresh · Made with love</div>
</header>

<div class="wrap">
  <div class="toggle">
    <button id="bWeekly" class="on">Weekday</button>
    <button id="bShabbos">Shabbos</button>
  </div>
  <p class="week" id="weekOf"></p>
  <div id="menu"><p class="empty">Loading menu…</p></div>

  <div class="details">
    <h3>Your details</h3>
    <label for="name">Name</label>
    <input id="name" autocomplete="name" required>
    <label for="phone">Number</label>
    <input id="phone" type="tel" autocomplete="tel" required>
    <label for="notes">Allergies</label>
    <textarea id="notes" rows="1" placeholder="Leave blank if none"></textarea>
  </div>
</div>

<div class="bar">
  <div class="fee"><span>Delivery fee</span><strong>$10</strong></div>
  <button class="send" id="send" disabled>Send order</button>
</div>

<script>
// Tari's WhatsApp number, digits only, with country code
const TARI_PHONE = "1778441461";
const DELIVERY_FEE = 10;

// Section order for each menu
const SECTIONS = {
  weekly: [["main", "Mains"], ["side", "Sides"], ["soup", "Soups"]],
  shabbos: [["appetizer", "Appetizers"], ["main", "Mains"], ["side", "Sides"], ["salad", "Salads"]]
};

let data = { weekOf: "", dishes: [] };
let mode = "weekly";
let cart = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function subtotal() {
  return Object.entries(cart).filter(([, q]) => q > 0).reduce((s, [i, q]) => s + data.dishes[i].price * q, 0);
}

function render() {
  $("weekOf").textContent = mode === "shabbos" ? "Shabbos menu" : data.weekOf;

  const list = data.dishes.map((d, i) => ({ ...d, i }))
    .filter(d => d.menu === mode && d.available);

  if (!list.length) {
    $("menu").innerHTML = '<p class="empty">Nothing is available right now. Check back soon!</p>';
  } else {
    const known = SECTIONS[mode];
    const isKnown = (c) => known.some(([k]) => k === c);
    const sections = [...known];
    if (list.some(d => !isKnown(d.cat))) sections.push([null, "Menu"]);

    let html = "";
    for (const [cat, title] of sections) {
      const group = cat === null ? list.filter(d => !isKnown(d.cat)) : list.filter(d => d.cat === cat);
      if (!group.length) continue;
      html += `<div class="section">${title}</div>`;
      for (const d of group) {
        const n = cart[d.i] || 0;
        html += `<div class="item">
          <div>
            <div class="name">${esc(d.name)}</div>
            <div class="meta">$${esc(d.price)}${d.serves ? " · serves " + esc(d.serves) : ""}</div>
          </div>
          <div class="step">
            <button data-i="${d.i}" data-d="-1" ${n === 0 ? "disabled" : ""}>−</button>
            <span>${n}</span>
            <button data-i="${d.i}" data-d="1">+</button>
          </div></div>`;
      }
    }
    $("menu").innerHTML = html;
  }

  const n = Object.values(cart).reduce((s, q) => s + Math.max(0, q), 0);
  $("send").disabled = n === 0;
  $("send").textContent = n ? `Send order · $${subtotal() + DELIVERY_FEE}` : "Send order";
}

$("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = Number(b.dataset.i);
  cart[i] = Math.max(0, (cart[i] || 0) + Number(b.dataset.d));
  render();
});

function setMode(m) {
  mode = m;
  cart = {};
  $("bWeekly").classList.toggle("on", m === "weekly");
  $("bShabbos").classList.toggle("on", m === "shabbos");
  render();
}
$("bWeekly").addEventListener("click", () => setMode("weekly"));
$("bShabbos").addEventListener("click", () => setMode("shabbos"));

$("send").addEventListener("click", () => {
  if (!$("name").reportValidity() || !$("phone").reportValidity()) return;
  const entries = Object.entries(cart).filter(([, q]) => q > 0);
  const lines = entries.map(([i, q]) => `${q} x ${data.dishes[i].name} ($${data.dishes[i].price * q})`);
  const sub = subtotal();
  const msg = [
    mode === "shabbos" ? "SHABBOS ORDER" : `WEEKDAY ORDER (${data.weekOf})`,
    `Name: ${$("name").value}`,
    `Number: ${$("phone").value}`,
    "", ...lines, "",
    `Items: $${sub}`,
    `Delivery fee: $${DELIVERY_FEE}`,
    `Total: $${sub + DELIVERY_FEE}`,
    $("notes").value ? `Allergies: ${$("notes").value}` : ""
  ].join("\n");
  window.open(`https://wa.me/${TARI_PHONE}?text=${encodeURIComponent(msg)}`, "_blank");
});

fetch("menu.json?" + Date.now(), { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("menu.json not found (" + r.status + ")");
    return r.json();
  })
  .then(d => { data = d; render(); })
  .catch(err => {
    $("menu").innerHTML = `<p class="empty">The menu can't load right now.<br><small>${esc(err.message)}</small></p>`;
  });

render();
</script>
</body>
</html>
