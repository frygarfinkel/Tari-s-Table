<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbeef2">
<title>Tari's Table</title>
<style>
:root{
  --bg:#fbeef2; --card:#fff; --ink:#6e1229; --muted:#b0556f; --line:#efc9d6;
  --pill:#f8d6e3; --accent:#7a1530; --accent-ink:#fff; --gray:#9a8a8f;
  --shadow:0 1px 2px rgba(122,21,48,.06),0 6px 18px rgba(122,21,48,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.35;
  padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Header */
header{text-align:center;padding:34px 16px 6px}
h1{font-size:2.5rem;margin:0;font-weight:600;letter-spacing:.01em}
.tag{letter-spacing:.28em;font-size:.7rem;color:var(--muted);margin-top:8px;text-transform:uppercase}
.flourish{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;color:var(--muted);max-width:200px}
.flourish::before,.flourish::after{content:"";flex:1;height:1px;background:var(--line)}

/* Sticky controls */
.controls{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,rgba(251,238,242,0));padding:12px 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;position:relative;box-shadow:var(--shadow)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:11px 8px;border-radius:999px;font-size:1rem;transition:color .25s}
.seg button[aria-selected="true"]{color:var(--accent-ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.seg.shabbos .thumb{transform:translateX(100%)}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:.85rem;color:var(--muted)}
.info b{color:var(--ink);font-weight:normal}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.8rem;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:.85rem;color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.switch input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.track{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);transition:background .25s}
.knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(122,21,48,.3);transition:transform .25s cubic-bezier(.3,.7,.2,1)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track .knob{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.switch.row{display:flex;justify-content:space-between;width:100%;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:.95rem}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s cubic-bezier(.3,.7,.2,1),opacity .25s}
.reveal>div{overflow:hidden}
.reveal.on{grid-template-rows:1fr;opacity:1}
/* Menu */
.section{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.section::before,.section::after{content:"";flex:1;height:1px;background:var(--line)}
.section span{background:var(--pill);padding:5px 18px;border-radius:999px;letter-spacing:.3em;font-size:.8rem;color:var(--accent)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .2s}
.item.in{border-color:var(--accent)}
.name{font-size:1.05rem}
.desc{font-size:.82rem;color:var(--muted);margin-top:2px}
.meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.meta .price{color:var(--ink)}
.gf{display:inline-block;vertical-align:middle;font-size:.62rem;letter-spacing:.12em;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 6px;margin-left:6px}
.add{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:8px 18px;font-size:.92rem;min-width:84px}
.add:active{background:var(--pill)}
.step{display:flex;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:104px;justify-content:space-between}
.step button{border:0;background:none;color:var(--accent-ink);width:36px;height:36px;font-size:1.2rem;line-height:1}
.step span{min-width:18px;text-align:center}
.empty{text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px 16px;margin-top:22px}
.empty .big{font-size:1.15rem;color:var(--ink);margin-bottom:4px}
.how{margin:30px 0 10px;text-align:center;color:var(--muted);font-size:.82rem}
.how ol{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.how li b{display:block;color:var(--accent);font-size:1.1rem;font-weight:normal}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.bar.show{transform:none}
.bar button{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:15px 22px;font-size:1rem;box-shadow:0 8px 24px rgba(122,21,48,.3)}
.count{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 9px;margin-right:8px;font-size:.85rem}

/* Checkout sheet */
.scrim{position:fixed;inset:0;background:rgba(60,10,25,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.3,.7,.2,1);padding:0 0 calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.open{overflow:hidden}
.sheet .wrap{padding-top:8px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.sheet-head h2{margin:0;font-size:1.4rem;font-weight:600}
.x{border:1px solid var(--line);background:var(--card);border-radius:50%;width:36px;height:36px;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:14px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .step{min-width:92px}
.line .step button{width:30px;height:30px;font-size:1.05rem}
.sum{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);font-size:.92rem}
.sum.total{color:var(--ink);font-size:1.1rem;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
label,.lbl{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;padding:12px 14px;font:inherit;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days .chip{font-size:.9rem;padding:9px 14px}
.err{color:#b3261e;font-size:.8rem;margin-top:6px;min-height:1em}
.send{display:block;width:100%;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:16px;font-size:1.05rem;margin-top:6px}
.fine{text-align:center;color:var(--muted);font-size:.8rem;margin:10px 0 0}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:.9rem;transition:all .3s;z-index:30;pointer-events:none;width:max-content;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Tari's Table</h1>
  <div class="tag">Homemade · Fresh · Made with love</div>
  <div class="flourish">♡</div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="seg" id="seg" role="tablist" aria-label="Menu">
      <span class="thumb"></span>
      <button role="tab" id="tWeekly" aria-selected="true">Weekday Dinners</button>
      <button role="tab" id="tShabbos" aria-selected="false">Shabbos</button>
    </div>
    <div class="info">
      <span id="infoText"></span>
      <label class="switch" for="gfChip">
        <span>Gluten free</span>
        <input type="checkbox" id="gfChip" role="switch">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </label>
    </div>  </div>

  <main id="menu"><p class="empty">Loading menu…</p></main>

  <section class="how" aria-label="How ordering works">
    How it works
    <ol>
      <li><b>1</b>Pick your dishes</li>
      <li><b>2</b>Choose a day</li>
      <li><b>3</b>Send on WhatsApp</li>
    </ol>
  </section>
</div>

<div class="bar" id="bar">
  <button id="barBtn"><span><span class="count" id="barCount">0</span>View order</span><span id="barTotal"></span></button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="wrap">
    <div class="sheet-head">
      <h2 id="sheetTitle">Your order</h2>
      <button class="x" id="closeBtn" aria-label="Close">✕</button>
    </div>

    <div class="card" id="lines"></div>
    <div class="card" style="padding:12px 16px">
      <div class="sum"><span>Items</span><span id="sSub"></span></div>
      <div class="sum"><span>Delivery</span><span id="sDel"></span></div>
      <div class="sum total"><span>Total</span><span id="sTot"></span></div>
    </div>

    <form id="form" novalidate>
      <div class="card" style="padding:4px 16px 16px">
        <span class="lbl" id="dayLabel"></span>
        <div class="days" id="days" role="radiogroup" aria-labelledby="dayLabel"></div>
        <div class="err" id="dayErr"></div>

        <label for="name">Your name</label>
        <input id="name" autocomplete="name" required>
        <label for="phone">Phone</label>
        <input id="phone" type="tel" autocomplete="tel" inputmode="tel" required>
        <label for="notes">Address & notes</label>
        <textarea id="notes" rows="2" placeholder="Street, apartment, gate code…"></textarea>

        <label class="switch row" for="gfChip2">
          <span>Gluten free</span>
          <input type="checkbox" id="gfChip2" role="switch">
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
        </label>
        <label class="switch row" for="hasAllergy">
          <span>Any allergies?</span>
          <input type="checkbox" id="hasAllergy" role="switch" aria-controls="allergyBox">
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
        </label>
        <div class="reveal" id="allergyBox"><div>
          <label for="allergies">Please list them</label>
          <input id="allergies" placeholder="e.g. nuts, sesame, dairy" tabindex="-1">
        </div></div>
        <div class="err" id="formErr"></div>
      </div>
      <button class="send" type="submit">Send order on WhatsApp</button>
      <p class="fine">WhatsApp opens with your order written out. Just tap send.</p>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
// ===== Settings =====
const TARI_PHONE = "17738441461";   // WhatsApp number, digits only, with country code
const DELIVERY_FEE = 10;
const DAYS = {
  weekly: ["Monday", "Wednesday"],
  shabbos: ["Friday"]
};
const DAY_LABEL = { weekly: "Delivery day", shabbos: "Delivery day" };
// Menu sections, in the order they show. "cat" in menu.json must match one of these.
const CATS = [["appetizer", "APPETIZERS"], ["soup", "SOUPS"], ["main", "MAINS"], ["food", "FOOD"], ["side", "SIDES"], ["salad", "SALADS"]];

// ===== State =====
let data = { weekOf: "", dishes: [] };
let mode = "weekly";
const carts = { weekly: {}, shabbos: {} };   // each menu keeps its own cart
const chosenDay = { weekly: "", shabbos: "" };
let gfOnly = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n) => "$" + (Math.round(n * 100) / 100).toLocaleString();
const cart = () => carts[mode];
const isSellable = (d) => d.available && typeof d.price === "number";

function entries() {
  return Object.entries(cart())
    .filter(([i, q]) => q > 0 && data.dishes[i] && isSellable(data.dishes[i]))
    .map(([i, q]) => ({ d: data.dishes[i], i: +i, q }));
}
function subtotal() { return entries().reduce((s, e) => s + e.d.price * e.q, 0); }
function itemCount() { return entries().reduce((s, e) => s + e.q, 0); }

function stepper(i, q) {
  return `<div class="step"><button type="button" data-i="${i}" data-d="-1" aria-label="Remove one">−</button><span>${q}</span><button type="button" data-i="${i}" data-d="1" aria-label="Add one">+</button></div>`;
}

// ===== Menu =====
function renderMenu() {
  const isShabbos = mode === "shabbos";
  $("seg").classList.toggle("shabbos", isShabbos);
  $("tWeekly").setAttribute("aria-selected", !isShabbos);
  $("tShabbos").setAttribute("aria-selected", isShabbos);
  $("infoText").innerHTML = isShabbos
    ? `<b>Shabbos menu</b> · Friday delivery · ${money(DELIVERY_FEE)}`
    : `<b>${esc(data.weekOf || "This week")}</b> · Mon & Wed delivery · ${money(DELIVERY_FEE)}`;
  $("gfChip").checked = gfOnly;
  $("gfChip2").checked = gfOnly;
  // Gluten free doesn't hide any dishes. It only tells Tari the order needs to be gluten free.
  const list = data.dishes.map((d, i) => ({ ...d, i }))
    .filter(d => d.menu === mode && isSellable(d));

  if (!list.length) {
    $("menu").innerHTML = `<div class="empty"><div class="big">Nothing on this menu yet</div>Check back soon, the new menu goes up Saturday night.</div>`;
  } else {
    let html = "";
    const known = CATS.map(c => c[0]);
    for (const [cat, title] of [...CATS, ["__other", "MORE"]]) {
      const group = list.filter(d => cat === "__other" ? !known.includes(d.cat || "food") : (d.cat || "food") === cat);
      if (!group.length) continue;
      html += `<div class="section"><span>${title}</span></div>`;
      for (const d of group) {
        const q = cart()[d.i] || 0;
        html += `<div class="item${q ? " in" : ""}">
          <div>
            <div class="name">${esc(d.name)}${d.gf ? '<span class="gf">GF</span>' : ""}</div>
            ${d.desc ? `<div class="desc">${esc(d.desc)}</div>` : ""}
            <div class="meta"><span class="price">${money(d.price)}</span>${d.size ? ` · ${esc(d.size)}` : ""}${d.serves ? ` · serves ${esc(d.serves)}` : ""}</div>
          </div>
          ${q ? stepper(d.i, q) : `<button type="button" class="add" data-i="${d.i}" data-d="1">Add</button>`}
        </div>`;
      }
    }
    $("menu").innerHTML = html;
  }
  renderBar();
}

function renderBar() {
  const n = itemCount();
  $("bar").classList.toggle("show", n > 0);
  $("barCount").textContent = n;
  $("barTotal").textContent = money(subtotal() + DELIVERY_FEE);
}

function change(i, delta) {
  const c = cart();
  c[i] = Math.max(0, (c[i] || 0) + delta);
  if (!c[i]) delete c[i];
  renderMenu();
  if (document.body.classList.contains("open")) {
    if (!itemCount()) closeSheet(); else renderSheet();
  }
}

// ===== Checkout sheet =====
function renderSheet() {
  $("sheetTitle").textContent = mode === "shabbos" ? "Your Shabbos order" : "Your dinner order";
  $("lines").innerHTML = entries().map(e => `
    <div class="line">
      <div><div class="name" style="font-size:.98rem">${esc(e.d.name)}</div><div class="meta">${money(e.d.price * e.q)}</div></div>
      ${stepper(e.i, e.q)}
    </div>`).join("");
  const sub = subtotal();
  $("sSub").textContent = money(sub);
  $("sDel").textContent = money(DELIVERY_FEE);
  $("sTot").textContent = money(sub + DELIVERY_FEE);
  $("dayLabel").textContent = DAY_LABEL[mode] + (mode === "weekly" ? " (delivered that evening)" : "");
  if (DAYS[mode].length === 1) chosenDay[mode] = DAYS[mode][0];
  $("days").innerHTML = DAYS[mode].map(d =>
    `<button type="button" class="chip" role="radio" aria-checked="${d === chosenDay[mode]}" aria-pressed="${d === chosenDay[mode]}" data-day="${esc(d)}">${esc(d)}</button>`
  ).join("");
}

let lastFocus = null;
function openSheet() {
  if (!itemCount()) return;
  lastFocus = document.activeElement;
  $("dayErr").textContent = ""; $("formErr").textContent = "";
  renderSheet();
  document.body.classList.add("open");
  $("sheet").scrollTop = 0;
  setTimeout(() => $("closeBtn").focus(), 50);
}
function closeSheet() {
  document.body.classList.remove("open");
  if (lastFocus) lastFocus.focus();
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3500);
}

// ===== Events =====
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (b) change(+b.dataset.i, +b.dataset.d);
  const day = e.target.closest("button[data-day]");
  if (day) { chosenDay[mode] = day.dataset.day; $("dayErr").textContent = ""; renderSheet(); }
});

function setMode(m) { if (m !== mode) { mode = m; renderMenu(); window.scrollTo({ top: 0, behavior: "smooth" }); } }
$("tWeekly").addEventListener("click", () => setMode("weekly"));
$("tShabbos").addEventListener("click", () => setMode("shabbos"));
for (const id of ["gfChip", "gfChip2"]) {
  $(id).addEventListener("change", () => { gfOnly = $(id).checked; renderMenu(); });
}
$("barBtn").addEventListener("click", openSheet);
$("closeBtn").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

// Remember the customer's details for next time
for (const id of ["name", "phone", "notes", "allergies"]) {
  $(id).value = localStorage.getItem("tt_" + id) || "";
  $(id).addEventListener("input", () => { localStorage.setItem("tt_" + id, $(id).value); $("formErr").textContent = ""; });
}

// Allergy switch: smoothly reveals the allergy field
function setAllergy(on, focus) {
  $("hasAllergy").checked = on;
  $("allergyBox").classList.toggle("on", on);
  $("allergies").tabIndex = on ? 0 : -1;
  if (on && focus) setTimeout(() => $("allergies").focus(), 200);
}
$("hasAllergy").addEventListener("change", () => setAllergy($("hasAllergy").checked, true));
setAllergy(!!$("allergies").value.trim(), false);

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!chosenDay[mode]) { $("dayErr").textContent = "Please pick a " + DAY_LABEL[mode].toLowerCase() + "."; $("days").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const name = $("name").value.trim(), phone = $("phone").value.trim(), notes = $("notes").value.trim();
  if (!name || !phone) { $("formErr").textContent = "Please add your name and phone number."; (name ? $("phone") : $("name")).focus(); return; }
  const allergies = $("hasAllergy").checked ? $("allergies").value.trim() : "";
  if ($("hasAllergy").checked && !allergies) { $("formErr").textContent = "Please list your allergies, or turn the switch off."; $("allergies").focus(); return; }

  const sub = subtotal();
  const msg = [
    mode === "shabbos" ? "SHABBOS ORDER" : `WEEKDAY DINNER ORDER (${data.weekOf})`,
    `Name: ${name}`,
    `Phone: ${phone}`,
    `${DAY_LABEL[mode]}: ${chosenDay[mode]}`,
    "",
    ...entries().map(e => `${e.q} x ${e.d.name} (${money(e.d.price * e.q)})`),
    "",
    `Items: ${money(sub)}`,
    `Delivery: ${money(DELIVERY_FEE)}`,
    `Total: ${money(sub + DELIVERY_FEE)}`,
    gfOnly ? "GLUTEN FREE: Yes, please make this order gluten free" : "",
    allergies ? `ALLERGIES: ${allergies}` : "",
    notes ? `Address/notes: ${notes}` : ""
  ].join("\n").trim();

  window.open(`https://wa.me/${TARI_PHONE}?text=${encodeURIComponent(msg)}`, "_blank");
  carts[mode] = {}; chosenDay[mode] = "";
  closeSheet(); renderMenu();
  toast("Almost done! Tap send in WhatsApp ♡");
});

// ===== Load the weekly menu (edit menu.json each Saturday night) =====
fetch("menu.json?" + Date.now())
  .then(r => r.json())
  .then(d => { data = d; renderMenu(); })
  .catch(() => { $("menu").innerHTML = '<div class="empty"><div class="big">The menu can\'t load right now</div>Please try again in a few minutes.</div>'; });
</script>
</body>
